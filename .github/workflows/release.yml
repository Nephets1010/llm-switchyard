name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只构建与校验，不上传（默认 true）'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: 完整构建 + 测试（发布前不允许跳过）
        run: ./mvnw -B -ntp clean verify -Dstyle.color=never

      - name: 构建源码包与 javadoc
        run: ./mvnw -B -ntp -Prelease package -Dgpg.skip=true -Dstyle.color=never

      - name: 上传到 Maven Central（仅正式 tag 且非 dry-run）
        # ★ 不要写成 `if: cond && ${{ ... }}`。
        #   if 条件本身就是表达式环境，写成混合形式时 actionlint 报
        #   "always evaluated to true because extra characters are around ${{ }}"，
        #   且语义在部分上下文中会与预期不符。
        #   正确写法：整个条件放进一个 ${{ }} 里。
        if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true }}
        run: ./mvnw -B -ntp -Prelease deploy -Dstyle.color=never

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: 'switchyard-*/target/*.jar'
