# 内置价格表（契约 PRC-001）
#
# ⚠️ 重要声明（请勿删除本段）：
#   1. 本文件中的价格会随时间失效。每一行都必须带 source 与 effectiveFrom，
#      否则使用者无法判断这个数字是否可信。
#   2. source=ESTIMATED 的条目是社区估算值，控制台会显式标注「社区估算」，
#      不可直接作为预算依据。
#   3. 用户可以在 classpath 根目录或外部文件放置自己的 switchyard-prices.yml 覆盖本表，
#      热更新无需重启（见 docs/configuration.md）。
#   4. 更新价格请提 PR，不要在代码里硬编码。
#
# 单位：CNY / 1000 tokens（契约固定用 CNY 核算，对外展示层负责换汇）
# 核对日期：2026-10-09

